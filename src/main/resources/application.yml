spring:
   application:
    name: FakeCommerceApplication
   datasource:
    url: jdbc:mysql://localhost:3306/fakecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 'next24@yrM'
    driver-class-name: com.mysql.cj.jdbc.Driver
   flyway:
    enabled: true
    locations: classpath:db/migration
   jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO
    com.example.FakeCommerce: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 10
