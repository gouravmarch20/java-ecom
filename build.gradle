plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core:9.22.3'
	implementation 'org.flywaydb:flyway-mysql:9.22.3'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'mysql:mysql-connector-java:8.0.33'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
    jvmArgs = [
        '-javaagent:newrelic/newrelic.jar',
        '-Dnewrelic.config.file=newrelic.yml'
    ]
}

tasks.named('bootJar') {
    manifest {
        attributes 'Start-Class': 'com.example.FakeCommerce.FakeCommerceApplication'
    }
}

// Run JAR with New Relic agent
task runJar(type: JavaExec) {
    group = 'application'
    description = 'Run the application JAR with New Relic agent'
    classpath = files(tasks.bootJar.outputs.files)
    mainClass = 'com.example.FakeCommerce.FakeCommerceApplication'
    jvmArgs = ['-javaagent:newrelic/newrelic.jar', '-Dnewrelic.config.file=newrelic.yml']
}
